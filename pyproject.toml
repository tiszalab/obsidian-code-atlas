[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-code-atlas"
version = "0.5.1"
description = "Mirror GitHub activity into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Michael Tisza"}]
keywords = ["obsidian", "github", "notes", "knowledge-management", "second-brain"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tiszalab/obsidian-code-atlas"
Repository = "https://github.com/tiszalab/obsidian-code-atlas"
Issues = "https://github.com/tiszalab/obsidian-code-atlas/issues"
Changelog = "https://github.com/tiszalab/obsidian-code-atlas/releases"

[project.scripts]
obsidian-code-atlas = "obsidian_code_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
